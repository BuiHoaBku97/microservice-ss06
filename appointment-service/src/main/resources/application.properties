spring.application.name=appointment-service
spring.config.import=optional:configserver:http://localhost:8888

logging.level.io.github.resilience4j.circuitbreaker=DEBUG

resilience4j.retry.instances.patientRetry.max-attempts=3
resilience4j.retry.instances.patientRetry.wait-duration=2s
resilience4j.retry.instances.patientRetry.retry-exceptions=org.springframework.web.client.ResourceAccessException

spring.cloud.openfeign.client.config.default.connectTimeout=1000
spring.cloud.openfeign.client.config.default.readTimeout=2000

resilience4j.circuitbreaker.instances.doctorServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.doctorServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.doctorServiceCB.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.doctorServiceCB.permittedNumberOfCallsInHalfOpenState=3

# Rate limiter for outbound calls to doctor-service
resilience4j.ratelimiter.instances.doctorServiceRateLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.doctorServiceRateLimiter.limit-refresh-period=10s
resilience4j.ratelimiter.instances.doctorServiceRateLimiter.timeout-duration=0

# Retry configuration for doctor service calls
resilience4j.retry.instances.doctorServiceRetry.max-attempts=3
resilience4j.retry.instances.doctorServiceRetry.wait-duration=1s
resilience4j.retry.instances.doctorServiceRetry.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.RestClientException
